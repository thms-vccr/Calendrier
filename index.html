<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f0e8">
  <title>Calendrier de l'Avent</title>  <style>
    :root {
      --blanc: #fffdf9;
      --texte: #413b35;
      --accent: #b48b61;
      --verrou: rgba(255, 253, 249, 0.75);
      --ombre: rgba(36, 29, 23, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--texte);
      background: #f5f0e8;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    /* =========================
       PAGE PRINCIPALE
    ========================== */

    #accueil {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background-color: #e9dfd1;
      background-image: url("fond.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .voile {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(30, 25, 20, 0.12),
        rgba(30, 25, 20, 0.03) 45%,
        rgba(30, 25, 20, 0.18)
      );
      pointer-events: none;
    }

    .entete {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 24px 12px 10px;
      color: white;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    .entete h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.6rem);
      font-weight: normal;
      letter-spacing: 0.04em;
    }

    .entete p {
      margin: 8px 0 0;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    /* BOUTONS DE LA GALERIE */
    .boutons-galerie {
      position: relative;
      z-index: 4;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
    }

    .bouton-galerie {
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      background: rgba(255, 253, 249, 0.82);
      color: var(--texte);
      font-family: Arial, sans-serif;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(36, 29, 23, 0.12);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .bouton-galerie:hover {
      transform: translateY(-1px);
      background: rgba(255, 253, 249, 0.98);
    }

    #calendrier {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .case {
      position: absolute;
      transform: translate(-50%, -50%);
      width: clamp(36px, 8.5vw, 58px);
      height: clamp(36px, 8.5vw, 58px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      background: var(--verrou);
      color: var(--texte);
      box-shadow: 0 3px 12px var(--ombre);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(14px, 3.5vw, 19px);
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .case.ouverte {
      background: rgba(255, 253, 249, 0.94);
      border-color: var(--accent);
    }

    .case:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .case:not(:disabled):hover {
      transform: translate(-50%, -50%) scale(1.12);
      box-shadow: 0 5px 18px rgba(36, 29, 23, 0.28);
    }

    .case:disabled {
      cursor: default;
      opacity: 0.72;
    }

    .pied {
      position: absolute;
      z-index: 1;
      bottom: 14px;
      left: 10px;
      right: 10px;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 11px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    /* =========================
       PAGE PHOTO ET CARTEL
    ========================== */

    #page-photo {
      min-height: 100vh;
      display: none;
      padding: 24px 16px 36px;
      align-items: center;
      justify-content: flex-start;
      flex-direction: column;
      gap: 16px;
      background: #f5f0e8;
    }

    .photo-cadre {
      width: min(100%, 850px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #photo-jour {
      display: block;
      max-width: 100%;
      max-height: 72vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 8px 30px rgba(45, 35, 25, 0.12);
    }

    .cartel {
      display: none;
      width: min(100%, 650px);
      margin-top: 2px;
      padding: 20px 24px 22px;
      border: 1px solid #292621;
      background: rgba(255, 253, 249, 0.55);
      text-align: center;
      color: var(--texte);
    }

    .cartel.visible { display: block; }

    .cartel-numero {
      margin: 0 0 9px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #746b60;
    }

    .cartel-titre {
      margin: 0 0 10px;
      font-size: clamp(1.15rem, 4vw, 1.45rem);
      line-height: 1.3;
      font-weight: normal;
    }

    .cartel-texte {
      margin: 0;
      font-size: 0.96rem;
      line-height: 1.65;
      color: #625a52;
      white-space: pre-line;
    }

    .retour {
      display: inline-block;
      margin-top: 2px;
      padding: 12px 20px;
      border: 1px solid #c9b59c;
      border-radius: 30px;
      color: var(--texte);
      background: transparent;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
      transition: background 0.2s ease;
    }

    .retour:hover { background: rgba(180, 139, 97, 0.12); }

    /* =========================
       GALERIE DE TRAVAIL
    ========================== */

    #galerie {
      min-height: 100vh;
      display: none;
      padding: 28px 16px 40px;
      background: #f5f0e8;
    }

    .galerie-contenu {
      width: min(100%, 1000px);
      margin: 0 auto;
    }

    .galerie-entete {
      text-align: center;
      margin-bottom: 24px;
    }

    .galerie-entete h2 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: normal;
    }

    .galerie-entete p {
      margin: 8px 0 0;
      font-size: 0.95rem;
      color: #746b60;
    }

    .grille-photos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .miniature {
      margin: 0;
      padding: 8px;
      background: var(--blanc);
      border: 1px solid rgba(65, 59, 53, 0.18);
      box-shadow: 0 4px 15px rgba(45, 35, 25, 0.08);
    }

    .miniature img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #e9dfd1;
    }

    .miniature figcaption {
      padding: 9px 4px 2px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: #746b60;
    }

    .galerie-retour {
      display: block;
      width: fit-content;
      margin: 28px auto 0;
    }

    /* =========================
       MESSAGE
    ========================== */

    #message {
      display: none;
      text-align: center;
      padding: 25px;
      max-width: 500px;
      line-height: 1.6;
      margin: 0 auto;
    }

    #message h2 { font-weight: normal; }

    @media (min-width: 700px) {
      .grille-photos {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .entete { padding-top: 18px; }
      .case { width: 38px; height: 38px; }

      .boutons-galerie {
        gap: 6px;
        padding-top: 6px;
      }

      .bouton-galerie {
        padding: 7px 10px;
        font-size: 10px;
      }

      #page-photo {
        padding: 18px 12px 28px;
        gap: 13px;
      }

      #photo-jour { max-height: 62vh; }
      .cartel { padding: 17px 16px 19px; }
      .cartel-texte { font-size: 0.92rem; }

      #galerie {
        padding: 22px 12px 32px;
      }

      .grille-photos {
        gap: 10px;
      }

      .miniature {
        padding: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style></head><body>  <!-- ACCUEIL DU CALENDRIER -->  <main id="accueil">
    <div class="voile"></div><header class="entete">
  <h1>Calendrier de l'Avent</h1>
  <p>Une collection de moments, à découvrir un à un.</p>
</header>

<!-- OUTILS DE TRAVAIL : À RETIRER AVANT LA VERSION FINALE -->
<div class="boutons-galerie" aria-label="Galeries de miniatures">
  <button class="bouton-galerie" type="button" data-debut="1">
    Photos 1–8
  </button>
  <button class="bouton-galerie" type="button" data-debut="9">
    Photos 9–16
  </button>
  <button class="bouton-galerie" type="button" data-debut="17">
    Photos 17–24
  </button>
</div>

<div id="calendrier" aria-label="Calendrier de l'Avent"></div>
<div class="pied">Décembre 2026</div>

  </main>  <!-- PAGE INDIVIDUELLE D'UNE PHOTO -->  <section id="page-photo" aria-label="Souvenir du jour">
    <div class="photo-cadre">
      <img id="photo-jour" src="" alt="Notre souvenir du jour">
    </div><div id="cartel" class="cartel" aria-live="polite">
  <div id="cartel-numero" class="cartel-numero"></div>
  <h2 id="cartel-titre" class="cartel-titre"></h2>
  <p id="cartel-texte" class="cartel-texte"></p>
</div>

<a class="retour" href="./">← Retour au calendrier</a>

  </section>  <!-- GALERIE DE MINIATURES -->  <section id="galerie" aria-label="Galerie de photos">
    <div class="galerie-contenu">
      <header class="galerie-entete">
        <h2 id="galerie-titre">Galerie</h2>
        <p>Miniatures de travail</p>
      </header>  <div id="grille-photos" class="grille-photos"></div>

  <a class="retour galerie-retour" href="./">
    ← Retour au calendrier
  </a>
</div>

  </section>  <!-- MESSAGE EN CAS DE JOUR NON DISPONIBLE OU D'ERREUR -->  <section id="message">
    <h2 id="message-titre">Ce souvenir n'est pas encore disponible</h2>
    <p id="message-texte">Reviens découvrir ce souvenir le moment venu.</p>
    <a class="retour" href="./">← Retour au calendrier</a>
  </section>  <script>

    /* CONFIGURATION DES 24 CASES */
    const positions = [
      [18, 19], [72, 14], [43, 25], [89, 34],
      [28, 39], [58, 18], [79, 48], [11, 55],
      [49, 45], [92, 61], [35, 60], [65, 69],
      [19, 76], [84, 83], [53, 87], [39, 12],
      [7, 34], [67, 34], [26, 82], [94, 20],
      [47, 72], [76, 58], [12, 89], [76, 86]
    ];

    /* CONTENU DES CARTELS */
    const cartels = {
      1: { titre: "Un soir à part", texte: "Vingt-quatre souvenirs, quelques voyages, beaucoup de moments partagés." },
      2: { titre: "Sans occasion particulière", texte: "" },
      3: { titre: "Musilac ensemble", texte: "" },
      4: { titre: "Brunch en bonne compagnie", texte: "" },
      5: { titre: "Face à face", texte: "" },
      6: { titre: "Dans la même direction", texte: "Il y a les destinations, les détours et les souvenirs. Et puis simplement le plaisir d'avancer dans la même direction" },
      7: { titre: "Prendre le temps de regarder", texte: "" },
      8: { titre: "On y va ?", texte: "" },
      9: { titre: "Eclaboussures comprises", texte: "" },
      10: { titre: "A nous !", texte: "Certaines vues sont encore plus belles lorsqu'on les regarde à deux." },
      11: { titre: "Mission accomplie", texte: "" },
      12: { titre: "Là où nous étions", texte: "" },
      13: { titre: "Le sérieux attendra", texte: "" },
      14: { titre: "Les petites attentions...", texte: "" },
      15: { titre: "...et les tenues ", texte: "" },
      16: { titre: "L'été à Aix-les-Bains", texte: "" },
      17: { titre: "Vélo à Thoune", texte: "" },
      18: { titre: "Le même décors autrement", texte: "Il y a les grands moments que l'on prepare, et ceux que l'on découvre simplement en les vivant." },
      19: { titre: "Chacun son panorama", texte: "" },
      20: { titre: "La prochaine étapes ?", texte: "" },
      21: { titre: "La joie, sans mode d'emploi", texte: "" },
      22: { titre: "Quelques traces devant nous", texte: "" },
      23: { titre: "Devant nous", texte: "Il y a eu tous ces endroits. Et il en reste encore tellement à découvrir." },
      24: { titre: "La suite", texte: "Vingt-quatre jours à regarder quelques souvenir. Et surtout une envie : continuer à en créer de nouveaux, ensemble." }
    };

    /* ÉLÉMENTS DES PAGES */
    const accueil = document.getElementById("accueil");
    const calendrier = document.getElementById("calendrier");
    const pagePhoto = document.getElementById("page-photo");
    const photoJour = document.getElementById("photo-jour");
    const galerie = document.getElementById("galerie");
    const grillePhotos = document.getElementById("grille-photos");
    const galerieTitre = document.getElementById("galerie-titre");
    const message = document.getElementById("message");
    const messageTitre = document.getElementById("message-titre");
    const messageTexte = document.getElementById("message-texte");

    const cartel = document.getElementById("cartel");
    const cartelNumero = document.getElementById("cartel-numero");
    const cartelTitre = document.getElementById("cartel-titre");
    const cartelTexte = document.getElementById("cartel-texte");

    /*
      MODE TEST
      Les 24 jours sont actuellement ouverts.
    */
    function nombreDeJoursDisponibles() {
      return 24;
    }

    /*
      VERSION FINALE POUR DÉCEMBRE :

      function nombreDeJoursDisponibles() {
        const maintenant = new Date();
        if (maintenant.getMonth() < 11) return 0;
        if (maintenant.getMonth() > 11) return 24;
        return Math.min(24, maintenant.getDate());
      }
    */

    function cheminPhoto(numero) {
      const jour = String(numero).padStart(2, "0");
      return `jour-${jour}.jpg`;
    }

    function afficherMessage(titre, texte) {
      accueil.style.display = "none";
      pagePhoto.style.display = "none";
      galerie.style.display = "none";
      message.style.display = "block";

      messageTitre.textContent = titre;
      messageTexte.textContent = texte;
    }

    /* AFFICHAGE D'UNE PHOTO */
    function afficherPhoto(numero) {
      if (!Number.isInteger(numero) || numero < 1 || numero > 24) {
        afficherMessage(
          "Souvenir introuvable",
          "Ce numéro ne correspond pas à une case du calendrier."
        );
        return;
      }

      const disponibles = nombreDeJoursDisponibles();

      if (numero > disponibles) {
        afficherMessage(
          "Encore un peu de patience",
          "Ce souvenir n'est pas encore disponible. Reviens le jour prévu."
        );
        return;
      }

      accueil.style.display = "none";
      message.style.display = "none";
      galerie.style.display = "none";
      pagePhoto.style.display = "flex";

      photoJour.style.display = "block";
      photoJour.alt = `Souvenir du ${numero} décembre`;
      photoJour.src = cheminPhoto(numero);

      const contenuCartel = cartels[numero] || {
        titre: "",
        texte: ""
      };

      cartelNumero.textContent =
        "FRAGMENT N°" + String(numero).padStart(2, "0");

      cartelTitre.textContent = contenuCartel.titre || "";
      cartelTexte.textContent = contenuCartel.texte || "";

      cartelTitre.style.display =
        contenuCartel.titre ? "block" : "none";

      cartelTexte.style.display =
        contenuCartel.texte ? "block" : "none";

      cartel.classList.add("visible");

      photoJour.onerror = function () {
        photoJour.style.display = "none";
        cartel.classList.remove("visible");

        afficherMessage(
          "Photo introuvable",
          "Vérifie que le fichier " + cheminPhoto(numero) +
          " a bien été ajouté au dépôt GitHub."
        );
      };
    }

    /* CRÉATION DU CALENDRIER */
    function creerCalendrier() {
      const disponibles = nombreDeJoursDisponibles();

      positions.forEach((position, index) => {
        const numero = index + 1;
        const bouton = document.createElement("button");

        bouton.type = "button";
        bouton.className = "case";
        bouton.textContent = numero;
        bouton.style.left = position[0] + "%";
        bouton.style.top = position[1] + "%";

        if (numero <= disponibles) {
          bouton.classList.add("ouverte");
          bouton.setAttribute(
            "aria-label",
            `Ouvrir le souvenir du ${numero} décembre`
          );
        } else {
          bouton.disabled = true;
          bouton.setAttribute(
            "aria-label",
            `Case ${numero}, disponible le ${numero} décembre`
          );
          bouton.title = "Disponible le " + numero + " décembre";
        }

        bouton.addEventListener("click", function () {
          if (numero <= nombreDeJoursDisponibles()) {
            window.location.href = "?jour=" + numero;
          }
        });

        calendrier.appendChild(bouton);
      });
    }

    /* AFFICHAGE D'UNE GALERIE DE 8 PHOTOS */
    function afficherGalerie(debut) {
      accueil.style.display = "none";
      pagePhoto.style.display = "none";
      message.style.display = "none";
      galerie.style.display = "block";

      grillePhotos.innerHTML = "";

      const fin = Math.min(debut + 7, 24);

      galerieTitre.textContent =
        `Photos ${debut} à ${fin}`;

      for (let numero = debut; numero <= fin; numero++) {
        const figure = document.createElement("figure");
        figure.className = "miniature";

        const image = document.createElement("img");
        image.src = cheminPhoto(numero);
        image.alt = `Miniature du jour ${numero}`;
        image.loading = "eager";

        const legende = document.createElement("figcaption");
        legende.textContent =
          "JOUR " + String(numero).padStart(2, "0");

        figure.appendChild(image);
        figure.appendChild(legende);
        grillePhotos.appendChild(figure);
      }
    }

    /* DÉMARRAGE */
    function demarrer() {
      const parametres = new URLSearchParams(window.location.search);
      const jourParametre = parametres.get("jour");

      if (jourParametre !== null) {
        const numero = Number(jourParametre);

        if (
          jourParametre.trim() === "" ||
          !Number.isInteger(numero) ||
          numero < 1 ||
          numero > 24
        ) {
          afficherMessage(
            "Lien invalide",
            "Ce lien ne correspond pas à un souvenir du calendrier."
          );
          return;
        }

        afficherPhoto(numero);
        return;
      }

      creerCalendrier();

      document.querySelectorAll(".bouton-galerie").forEach((bouton) => {
        bouton.addEventListener("click", function () {
          const debut = Number(this.dataset.debut);
          afficherGalerie(debut);
        });
      });
    }

    demarrer();
  </script></body>
</html>

<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f0e8">

  <title>Calendrier de l'Avent</title>

  <style>
    :root {
      --blanc: #fffdf9;
      --texte: #413b35;
      --accent: #b48b61;
      --verrou: rgba(255, 253, 249, 0.75);
      --ombre: rgba(36, 29, 23, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--texte);
      background: #f5f0e8;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       PAGE PRINCIPALE
    ========================== */

    #accueil {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background-color: #e9dfd1;
      background-image: url("fond.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .voile {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(30, 25, 20, 0.12),
        rgba(30, 25, 20, 0.03) 45%,
        rgba(30, 25, 20, 0.18)
      );
      pointer-events: none;
    }

    .entete {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 24px 12px 10px;
      color: white;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    .entete h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.6rem);
      font-weight: normal;
      letter-spacing: 0.04em;
    }

    .entete p {
      margin: 8px 0 0;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    #calendrier {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    /* =========================
       CASES DU CALENDRIER
    ========================== */

    .case {
      position: absolute;
      transform: translate(-50%, -50%);
      width: clamp(36px, 8.5vw, 58px);
      height: clamp(36px, 8.5vw, 58px);

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;

      background: var(--verrou);
      color: var(--texte);

      box-shadow: 0 3px 12px var(--ombre);

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(14px, 3.5vw, 19px);

      cursor: pointer;

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    /* Case déjà disponible */
    .case.ouverte {
      background: rgba(255, 253, 249, 0.94);
      border-color: var(--accent);
    }

    .case:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .case:not(:disabled):hover {
      transform: translate(-50%, -50%) scale(1.12);
      box-shadow: 0 5px 18px rgba(36, 29, 23, 0.28);
    }

    /* Les cases verrouillées restent visibles */
    .case:disabled {
      cursor: default;
      opacity: 0.72;
    }

    .pied {
      position: absolute;
      z-index: 1;
      bottom: 14px;
      left: 10px;
      right: 10px;

      text-align: center;
      color: white;

      font-family: Arial, sans-serif;
      font-size: 11px;

      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.7);

      pointer-events: none;
    }

    /* =========================
       PAGE PHOTO ET CARTEL
    ========================== */

    #page-photo {
      min-height: 100vh;
      display: none;

      padding: 24px 16px 36px;

      align-items: center;
      justify-content: flex-start;
      flex-direction: column;

      gap: 16px;

      background: #f5f0e8;
    }

    .photo-cadre {
      width: min(100%, 850px);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #photo-jour {
      display: block;
      max-width: 100%;
      max-height: 72vh;

      width: auto;
      height: auto;

      object-fit: contain;

      border-radius: 2px;
      box-shadow: 0 8px 30px rgba(45, 35, 25, 0.12);
    }

    /* CARTEL */

    .cartel {
      display: none;

      width: min(100%, 650px);
      margin-top: 2px;
      padding: 20px 24px 22px;

      border: 1px solid #292621;
      background: rgba(255, 253, 249, 0.55);

      text-align: center;
      color: var(--texte);
    }

    .cartel.visible {
      display: block;
    }

    .cartel-numero {
      margin: 0 0 9px;

      font-family: Arial, sans-serif;
      font-size: 10px;

      letter-spacing: 0.2em;
      text-transform: uppercase;

      color: #746b60;
    }

    .cartel-titre {
      margin: 0 0 10px;

      font-size: clamp(1.15rem, 4vw, 1.45rem);
      line-height: 1.3;

      font-weight: normal;
    }

    .cartel-texte {
      margin: 0;

      font-size: 0.96rem;
      line-height: 1.65;

      color: #625a52;
      white-space: pre-line;
    }

    .retour {
      display: inline-block;

      margin-top: 2px;
      padding: 12px 20px;

      border: 1px solid #c9b59c;
      border-radius: 30px;

      color: var(--texte);
      background: transparent;

      text-decoration: none;

      font-family: Arial, sans-serif;
      font-size: 14px;

      transition: background 0.2s ease;
    }

    .retour:hover {
      background: rgba(180, 139, 97, 0.12);
    }

    /* =========================
       PAGE MESSAGE
    ========================== */

    #message {
      display: none;

      text-align: center;
      padding: 25px;

      max-width: 500px;

      line-height: 1.6;
      margin: 0 auto;
    }

    #message h2 {
      font-weight: normal;
    }

    /* =========================
       VERSION MOBILE
    ========================== */

    @media (max-width: 600px) {
      .entete {
        padding-top: 18px;
      }

      .case {
        width: 38px;
        height: 38px;
      }

      #page-photo {
        padding: 18px 12px 28px;
        gap: 13px;
      }

      #photo-jour {
        max-height: 62vh;
      }

      .cartel {
        padding: 17px 16px 19px;
      }

      .cartel-texte {
        font-size: 0.92rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       ACCUEIL DU CALENDRIER
  ========================== -->

  <main id="accueil">

    <div class="voile"></div>

    <header class="entete">
      <h1>Calendrier de l'Avent</h1>
      <p>Une collection de moments.</p>
    </header>

    <div id="calendrier" aria-label="Calendrier de l'Avent"></div>

    <div class="pied">Décembre 2026</div>

  </main>


  <!-- =========================
       PAGE INDIVIDUELLE D'UNE PHOTO
  ========================== -->

  <section id="page-photo" aria-label="Souvenir du jour">

    <div class="photo-cadre">
      <img
        id="photo-jour"
        src=""
        alt="Notre souvenir du jour"
      >
    </div>

    <div id="cartel" class="cartel" aria-live="polite">
      <div id="cartel-numero" class="cartel-numero"></div>
      <h2 id="cartel-titre" class="cartel-titre"></h2>
      <p id="cartel-texte" class="cartel-texte"></p>
    </div>

    <a class="retour" href="./">
      ← Retour au calendrier
    </a>

  </section>


  <!-- =========================
       MESSAGE D'ERREUR OU CASE FERMÉE
  ========================== -->

  <section id="message">

    <h2 id="message-titre">
      Ce souvenir n'est pas encore disponible
    </h2>

    <p id="message-texte">
      Reviens découvrir ce souvenir le moment venu.
    </p>

    <a class="retour" href="./">
      ← Retour au calendrier
    </a>

  </section>


  <script>

    /* =========================
       CONFIGURATION DES 24 CASES

       Chaque position :
       [horizontal, vertical]
       en pourcentage.
    ========================== */

    const positions = [
      [18, 19], // Jour 01
      [72, 25], // Jour 02
      [43, 25], // Jour 03
      [89, 34], // Jour 04
      [28, 39], // Jour 05
      [58, 18], // Jour 06
      [79, 48], // Jour 07
      [11, 55], // Jour 08
      [49, 45], // Jour 09
      [92, 61], // Jour 10
      [35, 60], // Jour 11
      [65, 69], // Jour 12
      [19, 76], // Jour 13
      [84, 78], // Jour 14
      [53, 87], // Jour 15
      [39, 54], // Jour 16
      [7, 34],  // Jour 17
      [67, 34], // Jour 18
      [26, 65], // Jour 19
      [94, 20], // Jour 20
      [47, 72], // Jour 21
      [76, 58], // Jour 22
      [12, 89], // Jour 23
      [76, 90]  // Jour 24
    ];


    /* =========================
       CONTENU DES CARTELS
    ========================== */

    const cartels = {

      1: {
        titre: "Un soir à part",
        texte: "Vingt-quatre souvenirs, quelques voyages, beaucoup de moments partagés."
      },

      2: {
        titre: "Sans occasion particulière",
        texte: ""
      },

      3: {
        titre: "Musilac ensemble",
        texte: ""
      },

      4: {
        titre: "Brunch en bonne compagnie",
        texte: ""
      },

      5: {
        titre: "Face à face",
        texte: ""
      },

      6: {
        titre: "Dans la même direction",
        texte: "Il y a les destinations, les détours et les souvenirs. Et puis simplement le plaisir d'avancer dans la même direction."
      },

      7: {
        titre: "Prendre le temps de regarder",
        texte: ""
      },

      8: {
        titre: "On y va ?",
        texte: ""
      },

      9: {
        titre: "Éclaboussures comprises",
        texte: ""
      },

      10: {
        titre: "À nous !",
        texte: "Certaines vues sont encore plus belles lorsqu'on les regarde à deux."
      },

      11: {
        titre: "Mission accomplie",
        texte: ""
      },

      12: {
        titre: "Là où nous étions",
        texte: ""
      },

      13: {
        titre: "Le sérieux attendra",
        texte: ""
      },

      14: {
        titre: "Les petites attentions...",
        texte: ""
      },

      15: {
        titre: "...et les tenues",
        texte: ""
      },

      16: {
        titre: "L'été à Aix-les-Bains",
        texte: ""
      },

      17: {
        titre: "Vélo à Thoune",
        texte: ""
      },

      18: {
        titre: "Le même décor autrement",
        texte: "Il y a les grands moments que l'on prépare, et ceux que l'on découvre simplement en les vivant."
      },

      19: {
        titre: "Chacun son panorama",
        texte: ""
      },

      20: {
        titre: "La prochaine étape ?",
        texte: ""
      },

      21: {
        titre: "La joie, sans mode d'emploi",
        texte: ""
      },

      22: {
        titre: "Quelques traces devant nous",
        texte: ""
      },

      23: {
        titre: "Devant nous",
        texte: "Il y a eu tous ces endroits. Et il en reste encore tellement à découvrir."
      },

      24: {
        titre: "La suite",
        texte: "Vingt-quatre jours à regarder quelques souvenirs. Et surtout une envie : continuer à en créer de nouveaux, ensemble."
      }

    };


    /* =========================
       ÉLÉMENTS DES PAGES
    ========================== */

    const accueil = document.getElementById("accueil");
    const calendrier = document.getElementById("calendrier");

    const pagePhoto = document.getElementById("page-photo");
    const photoJour = document.getElementById("photo-jour");

    const message = document.getElementById("message");
    const messageTitre = document.getElementById("message-titre");
    const messageTexte = document.getElementById("message-texte");

    const cartel = document.getElementById("cartel");
    const cartelNumero = document.getElementById("cartel-numero");
    const cartelTitre = document.getElementById("cartel-titre");
    const cartelTexte = document.getElementById("cartel-texte");


    /* =========================
       MODE TEST : NOVEMBRE 2026

       Une case s'ouvre chaque jour
       du 1er au 24 novembre.
    ========================== */

    function nombreDeJoursDisponibles() {

      const maintenant = new Date();

      // Avant novembre : aucune case ouverte
      if (maintenant.getMonth() < 10) {
        return 0;
      }

      // Après novembre : toutes les cases ouvertes
      if (maintenant.getMonth() > 10) {
        return 24;
      }

      // En novembre : ouverture progressive
      return Math.min(24, maintenant.getDate());
    }


    /* =========================
       CHEMIN DES PHOTOS

       Les fichiers doivent être nommés :
       jour-01.jpg
       jour-02.jpg
       ...
       jour-24.jpg
    ========================== */

    function cheminPhoto(numero) {
      const jour = String(numero).padStart(2, "0");
      return `jour-${jour}.jpg`;
    }


    /* =========================
       AFFICHAGE D'UN MESSAGE
    ========================== */

    function afficherMessage(titre, texte) {

      accueil.style.display = "none";
      pagePhoto.style.display = "none";
      message.style.display = "block";

      messageTitre.textContent = titre;
      messageTexte.textContent = texte;
    }


    /* =========================
       AFFICHAGE D'UNE PHOTO
    ========================== */

    function afficherPhoto(numero) {

      if (
        !Number.isInteger(numero) ||
        numero < 1 ||
        numero > 24
      ) {

        afficherMessage(
          "Souvenir introuvable",
          "Ce numéro ne correspond pas à une case du calendrier."
        );

        return;
      }

      const disponibles = nombreDeJoursDisponibles();

      // Empêche l'accès à une photo non encore ouverte
      if (numero > disponibles) {

        afficherMessage(
          "Encore un peu de patience",
          "Ce souvenir n'est pas encore disponible. Reviens le jour prévu."
        );

        return;
      }

      accueil.style.display = "none";
      message.style.display = "none";
      pagePhoto.style.display = "flex";

      photoJour.style.display = "block";

      photoJour.alt =
        `Souvenir du ${numero}`;

      photoJour.src =
        cheminPhoto(numero);


      /* Affichage du cartel */

      const contenuCartel = cartels[numero] || {
        titre: "",
        texte: ""
      };

      cartelNumero.textContent =
        "FRAGMENT N°" +
        String(numero).padStart(2, "0");

      cartelTitre.textContent =
        contenuCartel.titre || "";

      cartelTexte.textContent =
        contenuCartel.texte || "";


      cartelTitre.style.display =
        contenuCartel.titre ? "block" : "none";

      cartelTexte.style.display =
        contenuCartel.texte ? "block" : "none";


      cartel.classList.add("visible");


      /* Gestion d'une photo introuvable */

      photoJour.onerror = function () {

        photoJour.style.display = "none";
        cartel.classList.remove("visible");

        afficherMessage(
          "Photo introuvable",
          "Vérifie que le fichier " +
          cheminPhoto(numero) +
          " a bien été ajouté au dépôt GitHub."
        );

      };

    }


    /* =========================
       CRÉATION DU CALENDRIER
    ========================== */

    
function creerCalendrier() {
  const disponibles = nombreDeJoursDisponibles();

  positions.forEach((position, index) => {
    const numero = index + 1;
    const bouton = document.createElement("button");

    bouton.type = "button";
    bouton.className = "case";
    bouton.textContent = numero;
    bouton.style.left = position[0] + "%";
    bouton.style.top = position[1] + "%";

    if (numero <= disponibles) {
      bouton.classList.add("ouverte");
      bouton.setAttribute(
        "aria-label",
        `Ouvrir le souvenir du ${numero} novembre`
      );
    } else {
      bouton.setAttribute(
        "aria-label",
        `Case ${numero}, disponible le ${numero} novembre`
      );
      bouton.title = `Disponible le ${numero} novembre`;
    }

    bouton.addEventListener("click", function () {
      if (numero <= nombreDeJoursDisponibles()) {
        window.location.href = "?jour=" + numero;
      } else {
        afficherMessage(
          "Encore un peu de patience",
          `Ce souvenir sera disponible le ${numero} novembre 2026.`
        );
      }
    });

    calendrier.appendChild(bouton);
  });
}

    /* =========================
       DÉMARRAGE DU SITE
    ========================== */

    function demarrer() {

      const parametres =
        new URLSearchParams(
          window.location.search
        );

      const jourParametre =
        parametres.get("jour");


      /* Si un jour est demandé */

      if (jourParametre !== null) {

        const numero =
          Number(jourParametre);


        if (
          jourParametre.trim() === "" ||
          !Number.isInteger(numero) ||
          numero < 1 ||
          numero > 24
        ) {

          afficherMessage(
            "Lien invalide",
            "Ce lien ne correspond pas à un souvenir du calendrier."
          );

          return;
        }


        afficherPhoto(numero);

        return;
      }


      /* Sinon : affichage du calendrier */

      creerCalendrier();

    }


    /* LANCEMENT */

    demarrer();

  </script>

</body>
</html>
